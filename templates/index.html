<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoodWatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #020b18;
            --card-bg: rgba(2, 8, 24, 0.72);
            --border: rgba(140, 190, 240, 0.1);
            --border-hover: rgba(140, 190, 240, 0.28);
            --text-primary: #d8eeff;
            --text-secondary: #5a8ab0;
            --text-muted: #2a5070;
            --accent: rgba(140, 190, 240, 0.15);
            --accent-hover: rgba(140, 190, 240, 0.25);
        }

        html, body {
            min-height: 100vh;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* ── Background ── */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .bg-img {
            position: absolute;
            width: 200%;
            height: 150%;
            top: -25%;
            left: -25%;
            background-image: url('/static/MoodWatch_Yn.jfif');
            background-size: 60%;
            background-repeat: no-repeat;
            background-position: 30% center;
            transform: rotate(0deg);
            filter: blur(2px) brightness(0.60) saturate(1.6);
        }

        .bg-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(2, 5, 15, 0.5) 0%,
                rgba(2, 5, 15, 0.2) 30%,
                rgba(2, 5, 15, 0.65) 70%,
                rgba(2, 5, 15, 0.97) 100%
            );
        }

        /* ── Pages ── */
        #landing-page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
        }

        #results-page {
            display: none;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 0;
        }

        /* ── Landing ── */
        .mw-title {
            font-size: 72px;
            font-weight: 700;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #ffffff 0%, #ffffff 30%, #a8c4e0 60%, #4a7aa8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.05;
            text-align: center;
            user-select: none;
        }

        .mw-catchphrase {
            font-size: 12px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #3a6880;
            margin-top: 12px;
            text-align: center;
        }

        .search-wrap {
            width: 100%;
            max-width: 560px;
            margin-top: 44px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(180, 220, 255, 0.16);
            border-radius: 999px;
            padding: 6px 6px 6px 22px;
            gap: 10px;
            transition: border-color 0.2s, background 0.2s;
            backdrop-filter: blur(12px);
        }

        .search-bar:focus-within {
            border-color: rgba(140, 190, 240, 0.38);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
            padding: 10px 0;
            font-family: 'Inter', sans-serif;
        }

        .search-input::placeholder { color: #2a4f6a; }

        .search-btn {
            background: var(--accent);
            border: 1px solid rgba(140, 190, 240, 0.22);
            border-radius: 999px;
            color: #90c8f0;
            padding: 10px 22px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .search-btn:hover { background: var(--accent-hover); color: #c8e8ff; }

        .mood-filters {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            font-size: 12px;
            padding: 6px 18px;
            border-radius: 999px;
            border: 1px solid rgba(140, 190, 240, 0.15);
            background: rgba(2, 5, 15, 0.5);
            color: #3a6880;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
            backdrop-filter: blur(6px);
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: rgba(100, 160, 220, 0.18);
            border-color: rgba(140, 190, 240, 0.35);
            color: #a8d8f8;
        }

        /* ── Results page ── */
        .results-topbar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 32px;
            border-bottom: 1px solid rgba(140, 190, 240, 0.07);
            backdrop-filter: blur(16px);
            background: rgba(2, 5, 15, 0.6);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .topbar-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(180deg, #ffffff 0%, #a8c4e0 60%, #4a7aa8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        .topbar-search {
            flex: 1;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(140, 190, 240, 0.12);
            border-radius: 999px;
            padding: 6px 6px 6px 18px;
            gap: 8px;
            transition: border-color 0.2s;
        }

        .topbar-search:focus-within { border-color: rgba(140, 190, 240, 0.32); }

        .topbar-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 13px;
            padding: 6px 0;
            font-family: 'Inter', sans-serif;
        }

        .topbar-input::placeholder { color: #2a4f6a; }

        .topbar-search-btn {
            background: var(--accent);
            border: 1px solid rgba(140, 190, 240, 0.2);
            border-radius: 999px;
            color: #90c8f0;
            padding: 6px 16px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
        }

        .topbar-search-btn:hover { background: var(--accent-hover); color: #c8e8ff; }

        .topbar-filters {
            display: flex;
            gap: 6px;
        }

        .topbar-filter-btn {
            font-size: 11px;
            padding: 5px 14px;
            border-radius: 999px;
            border: 1px solid rgba(140, 190, 240, 0.12);
            background: transparent;
            color: #2a5070;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
        }

        .topbar-filter-btn:hover,
        .topbar-filter-btn.active {
            background: rgba(100, 160, 220, 0.16);
            border-color: rgba(140, 190, 240, 0.3);
            color: #90c8f0;
        }

        /* ── Results content ── */
        .results-content {
            max-width: 860px;
            margin: 0 auto;
            padding: 24px 24px 48px;
        }

        .results-label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        /* ── Card ── */
        .result-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 10px;
            cursor: pointer;
            transition: border-color 0.15s, transform 0.15s;
            backdrop-filter: blur(14px);
        }

        .result-card:hover { border-color: var(--border-hover); }

        .card-compact {
            display: flex;
            align-items: stretch;
        }

        .card-poster {
            width: 80px;
            flex-shrink: 0;
            background: rgba(140, 190, 240, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e3d55;
            font-size: 24px;
            min-height: 116px;
            overflow: hidden;
        }

        .card-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            flex: 1;
            padding: 13px 16px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .card-year {
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-top: 1px;
        }

        .badges {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 999px;
            font-weight: 500;
        }

        .badge-movie  { background: rgba(14,68,124,0.35);  color: #7ab8e8; border: 1px solid rgba(55,138,221,0.2); }
        .badge-anime  { background: rgba(60,52,137,0.35);  color: #a89cf0; border: 1px solid rgba(127,119,221,0.2); }
        .badge-series { background: rgba(8,80,65,0.35);    color: #5dcaa5; border: 1px solid rgba(29,158,117,0.2); }
        .badge-genre  { background: rgba(140,190,240,0.06); color: #3a6880; border: 1px solid rgba(140,190,240,0.1); }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .imdb-pill {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 999px;
            background: rgba(186,117,23,0.15);
            color: #d4900a;
            border: 1px solid rgba(186,117,23,0.2);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .score-wrap {
            display: flex;
            align-items: center;
            gap: 7px;
            flex: 1;
        }

        .score-bg {
            flex: 1;
            max-width: 100px;
            height: 3px;
            background: rgba(140,190,240,0.08);
            border-radius: 99px;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, #1d9e75, #2dcfa0);
        }

        .score-label {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .card-footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .expand-hint {
            font-size: 11px;
            color: #1e3d55;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: color 0.15s;
        }

        .result-card:hover .expand-hint { color: #2a5878; }

        .btn-trailer {
            font-size: 12px;
            padding: 5px 14px;
            border-radius: 999px;
            border: 1px solid rgba(140,190,240,0.14);
            background: transparent;
            color: #3a6880;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            transition: all 0.15s;
        }

        .btn-trailer:hover { background: rgba(140,190,240,0.08); color: #90c8f0; border-color: rgba(140,190,240,0.25); }
        .btn-trailer.disabled { opacity: 0.3; pointer-events: none; cursor: default; }

        /* ── Expanded panel ── */
        .expanded-panel {
            display: none;
            border-top: 1px solid rgba(140,190,240,0.07);
            padding: 16px 18px;
            flex-direction: column;
            gap: 14px;
            background: rgba(0, 0, 0, 0.22);
        }

        .expanded-panel.open { display: flex; }

        .exp-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #1e3d55;
            margin-bottom: 5px;
        }

        .exp-desc {
            font-size: 13px;
            color: #5a8ab0;
            line-height: 1.65;
        }

        .review-item {
            border-left: 2px solid rgba(140,190,240,0.14);
            padding-left: 11px;
            font-size: 12px;
            color: #2a5070;
            font-style: italic;
            line-height: 1.6;
            margin-bottom: 6px;
        }

        .platforms {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .platform-pill {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 999px;
            border: 1px solid rgba(140,190,240,0.1);
            color: #3a6880;
            background: rgba(140,190,240,0.04);
        }

        .exp-score-row {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: #1e3d55;
        }

        .exp-actions {
            display: flex;
            gap: 7px;
        }

        .btn-like, .btn-dislike {
            padding: 6px 16px;
            border-radius: 999px;
            border: 1px solid rgba(140,190,240,0.1);
            background: transparent;
            color: #2a5070;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
        }

        .btn-like:hover    { background: rgba(29,158,117,0.12); color: #5dcaa5; border-color: rgba(29,158,117,0.25); }
        .btn-dislike:hover { background: rgba(226,75,74,0.08);  color: #f09595; border-color: rgba(226,75,74,0.2); }
        .btn-like.active    { background: rgba(29,158,117,0.18); color: #5dcaa5; border-color: rgba(29,158,117,0.3); pointer-events: none; }
        .btn-dislike.active { background: rgba(226,75,74,0.12);  color: #f09595; border-color: rgba(226,75,74,0.25); pointer-events: none; }

        /* ── Pagination ── */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
        }

        .page-btn {
            font-size: 12px;
            padding: 7px 20px;
            border-radius: 999px;
            border: 1px solid rgba(140,190,240,0.15);
            background: transparent;
            color: #3a6880;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.15s;
        }

        .page-btn:hover { background: var(--accent); color: #90c8f0; border-color: rgba(140,190,240,0.3); }
        .page-btn:disabled { opacity: 0.25; cursor: default; pointer-events: none; }

        .page-info {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ── Loading / empty states ── */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
            gap: 14px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 2px solid rgba(140,190,240,0.1);
            border-top-color: rgba(140,190,240,0.5);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 24px;
            gap: 10px;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>

<!-- Background -->
<div class="bg">
    <div class="bg-img"></div>
    <div class="bg-overlay"></div>
</div>

<!-- ── Landing Page ── -->
<div id="landing-page">
    <div class="mw-title">MoodWatch</div>
    <div class="mw-catchphrase">Your mood. Your next watch.</div>

    <div class="search-wrap">
        <div class="search-bar">
            <input
                class="search-input"
                id="landingInput"
                type="text"
                placeholder="I'm feeling something dark and emotional..."
                autocomplete="off"
            />
            <button class="search-btn" onclick="doSearch()">Find my watch</button>
        </div>
        <div class="mood-filters">
            <button class="filter-btn active" onclick="setFilter(this, 'all')">All</button>
            <button class="filter-btn" onclick="setFilter(this, 'movies')">Movies</button>
            <button class="filter-btn" onclick="setFilter(this, 'series')">Series</button>
            <button class="filter-btn" onclick="setFilter(this, 'anime')">Anime</button>
        </div>
    </div>
</div>

<!-- ── Results Page ── -->
<div id="results-page">
    <!-- Sticky topbar -->
    <div class="results-topbar">
        <div class="topbar-title" onclick="goHome()">MoodWatch</div>
        <div class="topbar-search">
            <input
                class="topbar-input"
                id="topbarInput"
                type="text"
                placeholder="Search again..."
                autocomplete="off"
            />
            <button class="topbar-search-btn" onclick="doSearchAgain()">Search</button>
        </div>
        <div class="topbar-filters">
            <button class="topbar-filter-btn active" onclick="setTopbarFilter(this, 'all')">All</button>
            <button class="topbar-filter-btn" onclick="setTopbarFilter(this, 'movies')">Movies</button>
            <button class="topbar-filter-btn" onclick="setTopbarFilter(this, 'series')">Series</button>
            <button class="topbar-filter-btn" onclick="setTopbarFilter(this, 'anime')">Anime</button>
        </div>
    </div>

    <!-- Results content -->
    <div class="results-content">
        <div id="resultsContainer"></div>
        <div id="pagination" class="pagination" style="display:none">
            <button class="page-btn" id="prevBtn" onclick="changePage(-1)">← Previous</button>
            <span class="page-info" id="pageInfo"></span>
            <button class="page-btn" id="nextBtn" onclick="changePage(1)">Next →</button>
        </div>
    </div>
</div>

<script>
       // ── State ──
    let currentQuery = '';
    let currentFilter = 'all';
    let topbarFilter = 'all';
    let pageCache = {};  // stores prefetched pages
    let totalPages = 1;
    let currentPage = 0;

    // ── Filter buttons ──
    function setFilter(btn, filter) {
        document.querySelectorAll('#landing-page .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = filter;
    }

    function setTopbarFilter(btn, filter) {
        document.querySelectorAll('.topbar-filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        topbarFilter = filter;
    }

    // ── Search ──
    function doSearch() {
        const query = document.getElementById('landingInput').value.trim();
        if (!query) return;
        document.getElementById('topbarInput').value = query;
        fetchResults(query, currentFilter, 0);
    }

    function doSearchAgain() {
        const query = document.getElementById('topbarInput').value.trim();
        if (!query) return;
        fetchResults(query, topbarFilter, 0);
    }

    function goHome() {
        document.getElementById('results-page').style.display = 'none';
        document.getElementById('landing-page').style.display = 'flex';
        document.getElementById('landingInput').value = '';
        allResults = [];
        currentPage = 0;
    }

    // ── API call ──

    async function fetchResults(query, filter, page = 0) {
        currentQuery = query;
        currentFilter = filter;
        currentPage = page;

        // show loading only on first page
        if (page === 0) {
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('results-page').style.display = 'block';
            document.getElementById('pagination').style.display = 'none';
            pageCache = {};  // clear cache on new search
            document.getElementById('resultsContainer').innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <span>Finding your next watch...</span>
                </div>
            `;
        }

        // check cache first
        if (pageCache[page]) {
            renderPage(pageCache[page], page);
            prefetchPage(page + 1);
            return;
        }

        try {
            const res = await fetch('/search-full', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, filter, page, page_size: 10 })
            });

            const data = await res.json();
            totalPages = data.total_pages;
            console.log('Backend says total_pages:', data.total_pages, '| total:', data.total);
            pageCache[page] = data;
            renderPage(data, page);

            // prefetch next page in background
            prefetchPage(page + 1);

        } catch (err) {
            document.getElementById('resultsContainer').innerHTML = `
                <div class="empty-state">
                    <i class="ti ti-alert-circle" style="font-size:32px;color:#f09595"></i>
                    <span>Something went wrong. Is the server running?</span>
                </div>
            `;
        }
    }

    async function prefetchPage(page) {
        if (page >= totalPages || pageCache[page]) return;
        try {
            const res = await fetch('/search-full', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: currentQuery, filter: currentFilter, page, page_size: 10 })
            });
            const data = await res.json();
            pageCache[page] = data;
        } catch (e) {
            console.error('Prefetch failed:', e);
        }
    }

    function renderPage(data, page) {
        const results = data.results || [];

        if (results.length === 0 && page === 0) {
            const message = data.message || 'No results found. Try a different mood.';
            document.getElementById('resultsContainer').innerHTML = `
                <div class="empty-state">
                    <i class="ti ti-mood-sad" style="font-size:32px"></i>
                    <span>${escHtml(message)}</span>
                </div>
            `;
            return;
        }

        const container = document.getElementById('resultsContainer');
        container.innerHTML = '';

        const label = document.createElement('p');
        label.className = 'results-label';
        label.textContent = `Results for "${currentQuery}" — ${data.total} found`;
        container.appendChild(label);

        results.forEach((result, idx) => {
            container.appendChild(buildCard(result, page * 10 + idx));
        });

        // pagination
        const pag = document.getElementById('pagination');
        if (data.total_pages > 1) {
            pag.style.display = 'flex';
            document.getElementById('prevBtn').disabled = page === 0;
            document.getElementById('nextBtn').disabled = page >= data.total_pages - 1;
            document.getElementById('pageInfo').textContent = `Page ${page + 1} of ${data.total_pages}`;
        } else {
            pag.style.display = 'none';
        }

        window.scrollTo(0, 0);
    }

    function changePage(dir) {
        const newPage = currentPage + dir;
        fetchResults(currentQuery, currentFilter, newPage);
    }




    // ── Build card ──
    function buildCard(result, idx) {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.id = `card-${idx}`;

        // Poster
        const posterHTML = result.poster_url
            ? `<img src="${result.poster_url}" alt="${escHtml(result.title)}" loading="lazy" />`
            : `<i class="ti ${result.content_type === 'movie' ? 'ti-movie' : 'ti-device-tv'}"></i>`;

        // Type badge
        const typeBadge = `<span class="badge badge-${result.content_type}">${capitalize(result.content_type)}</span>`;

        // Genre badges (max 2)
        const genres = (result.genres || '').split(',').slice(0, 2).map(g => g.trim()).filter(Boolean);
        const genreBadges = genres.map(g => `<span class="badge badge-genre">${escHtml(g)}</span>`).join('');

        // Score bar
        const scorePct = result.match_pct || 0;
        const scoreWidth = Math.min(scorePct, 99);

        // Trailer button
        const trailerBtn = result.content_type === 'movie'
            ? `<a class="btn-trailer disabled" data-tmdb-id="${result.id}" data-fetched="false" onclick="event.stopPropagation()"><i class="ti ti-player-play"></i> Trailer</a>`
            : `<span class="btn-trailer disabled"><i class="ti ti-player-play"></i> Trailer</span>`;

        // Providers
        const providers = (result.providers || []).slice(0, 4);
        const platformsHTML = providers.length
            ? `<div class="platforms">${providers.map(p => `<span class="platform-pill">${escHtml(p)}</span>`).join('')}</div>`
            : `<span style="font-size:12px;color:#1e3d55">Not available in your region</span>`;

        // Snippets
        const snippets = (result.snippets || []).slice(0, 2);
        const snippetsHTML = snippets.length
            ? snippets.map(s => `<div class="review-item">"${escHtml(s.substring(0, 160))}..."</div>`).join('')
            : '<span style="font-size:12px;color:#1e3d55">No reviews available</span>';

        card.innerHTML = `
            <div class="card-compact" onclick="toggleCard(${idx})">
                <div class="card-poster">${posterHTML}</div>
                <div class="card-body">
                    <div class="card-top">
                        <span class="card-title">${escHtml(result.title)}</span>
                        <span class="card-year">${result.release_year || ''}</span>
                    </div>
                    <div class="badges">
                        ${typeBadge}
                        ${genreBadges}
                    </div>
                    <div class="meta-row">
                        <span class="imdb-pill"><i class="ti ti-star" style="font-size:10px"></i> ${result.rating || 'N/A'}</span>
                        <div class="score-wrap">
                            <div class="score-bg"><div class="score-fill" style="width:${scoreWidth}%"></div></div>
                            <span class="score-label">${scorePct}% match</span>
                        </div>
                    </div>
                    <div class="card-footer-row">
                        <span class="expand-hint"><i class="ti ti-chevron-down" style="font-size:11px"></i> Details</span>
                        ${trailerBtn}
                    </div>
                </div>
            </div>
            <div class="expanded-panel" id="exp-${idx}">
                <div>
                    <p class="exp-label">About</p>
                    <p class="exp-desc">${escHtml(result.description || 'No description available.')}</p>
                </div>
                <div>
                    <p class="exp-label">What people say</p>
                    ${snippetsHTML}
                </div>
                <div>
                    <p class="exp-label">Available on</p>
                    ${platformsHTML}
                </div>
                <div class="exp-score-row">
                    <span>TF-IDF: ${result.tfidf_score}</span>
                    <span>·</span>
                    <span>Sentiment: ${result.polarity !== null ? result.polarity : 'N/A'}</span>
                    <span>·</span>
                    <span>Final: ${result.final_score}</span>
                </div>
                <div class="exp-actions">
                    <button class="btn-like" onclick="sendFeedback('${result.id}', 'like', this)">
                        <i class="ti ti-heart"></i> Like
                    </button>
                    <button class="btn-dislike" onclick="sendFeedback('${result.id}', 'dislike', this)">
                        <i class="ti ti-thumb-down"></i> Not for me
                    </button>
                </div>
            </div>
        `;

        return card;
    }

    // ── Toggle card expand ──
    async function toggleCard(idx) {
    const panel = document.getElementById(`exp-${idx}`);
    const isOpen = panel.classList.contains('open');
    document.querySelectorAll('.expanded-panel').forEach(p => p.classList.remove('open'));
    if (!isOpen) {
        panel.classList.add('open');
        // fetch trailer lazily if not already fetched
        const trailerBtn = panel.closest('.result-card').querySelector('.btn-trailer');
        if (trailerBtn && trailerBtn.dataset.fetched !== 'true') {
            const tmdbId = trailerBtn.dataset.tmdbId;
            if (tmdbId) {
                const res = await fetch(`/trailer/${tmdbId}`);
                const data = await res.json();
                if (data.trailer_url) {
                    trailerBtn.href = data.trailer_url;
                    trailerBtn.classList.remove('disabled');
                }
            }
            trailerBtn.dataset.fetched = 'true';
        }
    }
}

    // ── Feedback ──
    async function sendFeedback(titleId, type, btn) {
    const parent = btn.parentElement;
    const likeBtn = parent.querySelector('.btn-like');
    const dislikeBtn = parent.querySelector('.btn-dislike');

    // If already active, undo it
    if (btn.classList.contains('active')) {
        btn.classList.remove('active');
        likeBtn.style.opacity = '1';
        dislikeBtn.style.opacity = '1';
        return;
    }

    // Clear both first
    likeBtn.classList.remove('active');
    dislikeBtn.classList.remove('active');
    likeBtn.style.opacity = '1';
    dislikeBtn.style.opacity = '1';

    // Set the clicked one active
    btn.classList.add('active');

    try {
        await fetch('/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title_id: titleId, feedback_type: type })
        });
    } catch (e) {
        console.error('Feedback failed:', e);
    }
}

    // ── Helpers ──
    function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

    function escHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // ── Keyboard shortcut ──
    document.getElementById('landingInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') doSearch();
    });

    document.getElementById('topbarInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') doSearchAgain();
    });
</script>
</body>
